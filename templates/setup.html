{% extends 'base.html' %}{% block body %}<section class="card login"><h1>Installation initiale</h1><p class="muted">Créez le premier administrateur. Le code d’installation provient de la variable SETUP_KEY configurée sur le serveur.</p><form method="post"><input type="hidden" name="csrf" value="{{csrf_token()}}"><div class="field"><label>Code d’installation</label><input name="setup_key" type="password" required></div><div class="field"><label>Identifiant administrateur</label><input name="username" autocomplete="username" required></div><div class="field"><label>Mot de passe (minimum 12 caractères)</label><input name="password" type="password" minlength="12" autocomplete="new-password" required></div><button class="btn">Créer le compte</button></form></section>{% endblock %}
