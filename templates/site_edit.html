{% extends 'base.html' %}{% block body %}<h1>Modifier le site {{s.code}}</h1><section class="card"><form method="post"><input type="hidden" name="csrf" value="{{csrf_token()}}"><div class="formgrid">{% for key,label in [('code','Code site'),('name','Nom du site'),('quartier','Quartier'),('responsable','Responsable'),('client','Client / contrat'),('observations','Observations')] %}<div class="field"><label>{{label}}</label><input name="{{key}}" value="{{s[key]}}" {% if key in ('code','name') %}required{% endif %}></div>{% endfor %}<div class="field"><label>Zone affectée</label><select name="zone_id"><option value="">Sans zone</option>{% for z in zones %}<option value="{{z.id}}" {% if s.zone_id==z.id %}selected{% endif %}>{{z.name}}</option>{% endfor %}</select></div><div class="field"><label>Situation</label><select name="situation"><option {% if s.situation=='ACTIF' %}selected{% endif %}>ACTIF</option><option {% if s.situation=='INACTIF' %}selected{% endif %}>INACTIF</option></select></div></div><div class="actions"><button class="btn">Enregistrer</button><a class="btn secondary" href="{{url_for('sites')}}">Retour</a></div></form></section>{% endblock %}
